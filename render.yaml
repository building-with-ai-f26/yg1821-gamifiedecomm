# Render blueprint: tells Render how to build and run Credexon League.
# Secrets are marked sync: false, so Render asks for them in its dashboard; they never live in this repo.
services:
  - type: web
    name: credexon-league
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: AI_DAILY_LIMIT
        value: "300"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: APP_URL
        sync: false
